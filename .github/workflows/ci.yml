name: CI

on:
  push:
    branches: [main, wip]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

# Every action is named by the commit of the release in the comment next to it. A tag of an
# action can be moved by its owner, and a commit cannot.
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - run: ./mvnw -B verify

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: failure()
        with:
          name: test-reports
          path: |
            target/surefire-reports
            target/failsafe-reports
          if-no-files-found: ignore

  local-stack:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - run: docker compose build

      - run: docker compose up --detach --wait

      - run: scripts/demo.sh

      - run: scripts/check-observability.sh

      # The JVM is the process of the container, so a stop sends it the SIGTERM that starts the
      # drain. It leaves 143 when it ended by itself, and 137 when it was killed after the 30 s
      # that a stop allows it.
      - name: Stop a replica and require the exit code 143
        run: |
          docker compose stop replica-2
          container=$(docker compose ps --all --quiet replica-2)
          exit_code=$(docker inspect --format '{{.State.ExitCode}}' "$container")
          echo "replica-2 exited with $exit_code"
          test "$exit_code" = 143

      - if: failure()
        run: docker compose logs --no-color

      - if: always()
        run: docker compose down --volumes

  helm-chart:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: azure/setup-helm@9bc31f4ebc9c6b171d7bfbaa5d006ae7abdb4310 # v5.0.1
        with:
          version: v4.3.0

      # No action installs kubeconform. This is the archive of its release for the runner, held
      # to the checksum that the release lists for it.
      - name: Install kubeconform 0.8.0
        run: |
          curl --silent --show-error --fail --location \
            --output "$RUNNER_TEMP/kubeconform.tar.gz" \
            https://github.com/yannh/kubeconform/releases/download/v0.8.0/kubeconform-linux-amd64.tar.gz
          echo "9bc2bffbf71f261128533edaf912153948b7ff238f9a531ae6d34466ec287883  $RUNNER_TEMP/kubeconform.tar.gz" \
            | sha256sum --check
          sudo tar --extract --gzip --file "$RUNNER_TEMP/kubeconform.tar.gz" \
            --directory /usr/local/bin kubeconform

      - run: scripts/check-chart.sh

      # Installs kind and kubectl and creates no cluster. The script creates it, as it does on
      # any other machine, and the action deletes the cluster of this name when the job ends.
      - uses: helm/kind-action@ef37e7f390d99f746eb8b610417061a60e82a6cc # v1.14.0
        with:
          version: v0.33.0
          kubectl_version: v1.37.0
          install_only: true
          cluster_name: reliable-webhooks-smoke

      - run: scripts/kind-smoke.sh

  terraform:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: infra/terraform
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1
        with:
          terraform_version: 1.16.5

      - run: terraform fmt -check -recursive -diff

      # Without a backend and without credentials: the providers and the modules are all that
      # the steps below need. The lock file is read and not rewritten, so a provider that it
      # does not name fails the job.
      - run: terraform init -backend=false -lockfile=readonly -input=false

      - run: terraform validate

      # Plans against a mocked provider. No step of this job calls AWS.
      - run: terraform test -var-file=example.tfvars

      - uses: terraform-linters/setup-tflint@6ffdbaa3be476b3431f7275c26966ef32ff60337 # v6.3.2
        with:
          tflint_version: v0.64.0

      # The plugin with the AWS rules is a release on GitHub, which limits how often a runner
      # may ask for one without a token.
      - run: tflint --init
        env:
          GITHUB_TOKEN: ${{ github.token }}

      - run: tflint

      # A lint that passes does not show how far the rules reach. The database instance is
      # declared two module calls below main.tf, so the rules refuse an instance class that
      # RDS does not have only if they follow the values that far. tflint ends with 2 when it
      # has found an issue and nothing else went wrong.
      - name: Require that tflint refuses an instance class that RDS does not have
        run: |
          status=0
          tflint --only aws_db_instance_invalid_type --var database_instance_class=db.t4g.none || status=$?
          test "$status" = 2
