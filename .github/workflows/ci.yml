name: CI

on:
  push:
    branches: [main, wip]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - run: ./mvnw -B verify

      - uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: test-reports
          path: |
            target/surefire-reports
            target/failsafe-reports
          if-no-files-found: ignore

  local-stack:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7

      - run: docker compose build

      - run: docker compose up --detach --wait

      - run: scripts/demo.sh

      - run: scripts/check-observability.sh

      # The JVM is the process of the container, so a stop sends it the SIGTERM that starts the
      # drain. It leaves 143 when it ended by itself, and 137 when it was killed after the 30 s
      # that a stop allows it.
      - run: |
          docker compose stop replica-2
          container=$(docker compose ps --all --quiet replica-2)
          exit_code=$(docker inspect --format '{{.State.ExitCode}}' "$container")
          echo "replica-2 exited with $exit_code"
          test "$exit_code" = 143

      - if: failure()
        run: docker compose logs --no-color

      - if: always()
        run: docker compose down --volumes

  helm-chart:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7

      - uses: azure/setup-helm@v5
        with:
          version: v4.3.0

      # No action installs kubeconform. This is the archive of its release for the runner, held
      # to the checksum that the release lists for it.
      - run: |
          curl --silent --show-error --fail --location \
            --output "$RUNNER_TEMP/kubeconform.tar.gz" \
            https://github.com/yannh/kubeconform/releases/download/v0.8.0/kubeconform-linux-amd64.tar.gz
          echo "9bc2bffbf71f261128533edaf912153948b7ff238f9a531ae6d34466ec287883  $RUNNER_TEMP/kubeconform.tar.gz" \
            | sha256sum --check
          sudo tar --extract --gzip --file "$RUNNER_TEMP/kubeconform.tar.gz" \
            --directory /usr/local/bin kubeconform

      - run: scripts/check-chart.sh

      # Installs kind and kubectl and creates no cluster. The script creates it, as it does on
      # any other machine, and the action deletes the cluster of this name when the job ends.
      - uses: helm/kind-action@v1
        with:
          version: v0.33.0
          kubectl_version: v1.37.0
          install_only: true
          cluster_name: reliable-webhooks-smoke

      - run: scripts/kind-smoke.sh
