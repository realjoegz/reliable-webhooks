spring:
  application:
    name: reliable-webhooks
  threads:
    virtual:
      enabled: true
  jackson:
    property-naming-strategy: SNAKE_CASE
    deserialization:
      # A number with a fraction is refused where a whole number belongs. Left on, a burst of
      # 1.9 would be set as 1.
      accept-float-as-int: false
    factory:
      constraints:
        read:
          # The limit that EventRequest sets for an event body, for the bodies of the other
          # routes. The parser keeps the member names it has read in a table that all requests
          # share, and without this a name of up to 50,000 bytes stays in it. The limit counts
          # bytes because RequestBodyCharset has every body read as UTF-8.
          max-name-length: 1024
  mvc:
    formcontent:
      filter:
        # No route takes a form. This filter of Spring runs ahead of ApiKeyFilter. For a PUT,
        # PATCH or DELETE that is sent as a form it reads the whole body into memory, on any
        # path and before the request is authenticated.
        enabled: false
  servlet:
    multipart:
      # No route takes a multipart body. Left on, Spring parses such a body before it looks for
      # a route, on any path and so also where no key is taken, up to the 10 MB that Spring Boot
      # allows a request.
      enabled: false
  web:
    resources:
      add-mappings: false
  flyway:
    # With a URL of its own, Flyway opens short-lived connections outside both pools. A
    # migration is therefore not cut off by the statement and lock timeouts of the pools.
    url: ${webhooks.database.url}
    user: ${webhooks.database.username}
    password: ${webhooks.database.password}

server:
  shutdown: graceful

management:
  endpoints:
    web:
      exposure:
        include: health,prometheus
  endpoint:
    health:
      probes:
        enabled: true
      group:
        liveness:
          # A replica whose poller no longer loops is not live, whatever else still answers.
          include: livenessState,poller
  health:
    db:
      # The health endpoint takes no key. It must not borrow connections from the pools.
      enabled: false
  otlp:
    metrics:
      export:
        # The meters are scraped from the prometheus endpoint. The OpenTelemetry starter brings a
        # registry that would also push them to a collector on this host.
        enabled: false
  opentelemetry:
    # Spring Boot would map the OTEL_ variables of the environment onto its settings. A variable
    # that a platform sets for every process would then switch an export on or change what is
    # sampled.
    map-environment-variables: false
  # Spans are exported once management.opentelemetry.tracing.export.otlp.endpoint names a
  # collector. Without it they are exported nowhere.

# webhooks.database.url, .username and .password, webhooks.admin-token and
# webhooks.secret-encryption-key have no default. They come from the environment.
webhooks:
  # What this replica writes to the attempt rows it records. A container has its own name as
  # HOSTNAME. Without one the id is random and lasts as long as the process.
  replica-id: ${HOSTNAME:${random.uuid}}
  database:
    api:
      max-size: 16
      borrow-timeout: 3s
      connect-timeout: 2s
      socket-timeout: 10s
      tcp-keep-alive: true
      lock-timeout: 2s
      statement-timeout: 5s
      idle-in-transaction-timeout: 10s
    worker:
      max-size: 16
      borrow-timeout: 3s
      connect-timeout: 2s
      socket-timeout: 15s
      tcp-keep-alive: true
      lock-timeout: 5s
      statement-timeout: 10s
      idle-in-transaction-timeout: 10s
  delivery:
    attempt-deadline: 15s
    lease: 60s
    start-cutoff: 35s
    finalize-cutoff: 55s
    max-attempts: 12
    max-in-flight: 64
  ssrf:
    # Both are for tests and docker compose. The service refuses to start with either of them
    # set unless the unsafe-local profile is active.
    allow-cidrs: []
    allow-http: false

---
spring:
  config:
    activate:
      on-profile: "!local"

logging:
  structured:
    format:
      console: logstash
    json:
      # The names that tracing gives the ids of the current span, as the other fields are named.
      rename:
        traceId: trace_id
        spanId: span_id
