# The subscriber of examples/subscriber, as compose.yaml runs it: the one source file on the JDK
# image that the Dockerfile builds with. scripts/kind-smoke.sh makes the ConfigMap from that file.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: subscriber
  namespace: reliable-webhooks
spec:
  replicas: 1
  selector:
    matchLabels:
      app: subscriber
  template:
    metadata:
      labels:
        app: subscriber
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        runAsGroup: 65532
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: subscriber
          image: eclipse-temurin:21-jdk-alpine@sha256:0bfc69a4758a86710e5c474032d28400a8bd00874766f9e8b1642ac2fd293159
          command:
            - java
            - /subscriber/Subscriber.java
            - "8082"
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
          ports:
            - containerPort: 8082
          readinessProbe:
            tcpSocket:
              port: 8082
            periodSeconds: 2
          volumeMounts:
            - name: source
              mountPath: /subscriber
              readOnly: true
      volumes:
        - name: source
          configMap:
            name: subscriber-source
---
# A node port, so that the script reaches the subscriber from outside the cluster to give it its
# secret and to tell it what to answer. The replicas reach it as subscriber:8082.
apiVersion: v1
kind: Service
metadata:
  name: subscriber
  namespace: reliable-webhooks
spec:
  type: NodePort
  selector:
    app: subscriber
  ports:
    - port: 8082
      targetPort: 8082
      nodePort: 30082
