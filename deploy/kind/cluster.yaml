# The cluster of scripts/kind-smoke.sh: one node in a container.
kind: Cluster
apiVersion: kind.x-k8s.io/v1alpha4
networking:
  # The default of kind, written down because values.yaml allows the replicas this range.
  serviceSubnet: 10.96.0.0/16
nodes:
  - role: control-plane
    image: kindest/node:v1.37.0@sha256:a1ed56cfb0e7b93589bdf97c8cd566405a265939e3620fc4f5de89adff580ae5
    # The node ports of the service and of the subscriber. Each is published on a port of the
    # loopback address that kind chooses, so that no port has to be free for it. "docker port"
    # prints the address.
    extraPortMappings:
      - containerPort: 30080
        listenAddress: 127.0.0.1
      - containerPort: 30082
        listenAddress: 127.0.0.1
