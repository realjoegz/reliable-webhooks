# The Secret that deploy/kind/values.yaml names to the chart. Its values are the development
# values of compose.yaml: they are public and protect nothing.
apiVersion: v1
kind: Secret
metadata:
  name: reliable-webhooks-credentials
  namespace: reliable-webhooks
stringData:
  database-password: password-for-local-development-only
  admin-token: admin-token-for-local-development-only
  # The 32 bytes "secret-key-for-local-development" in base64.
  secret-encryption-key: c2VjcmV0LWtleS1mb3ItbG9jYWwtZGV2ZWxvcG1lbnQ=
