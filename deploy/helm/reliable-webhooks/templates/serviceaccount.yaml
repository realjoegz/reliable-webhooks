# The replicas do not run under the default account of the namespace, so an image pull secret or
# a cloud role that is attached to that account does not reach them. The Deployment mounts no
# token of this one.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ include "reliable-webhooks.fullname" . }}
  labels:
    {{- include "reliable-webhooks.labels" . | nindent 4 }}
